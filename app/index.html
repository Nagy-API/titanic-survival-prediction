<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival Prediction</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: radial-gradient(circle at 20% 15%, rgba(245,199,107,.18), transparent 28%), linear-gradient(135deg, #08111f, #020617);
        }
        .card {
            width: min(680px, 100%);
            padding: 34px;
            border-radius: 28px;
            background: rgba(15, 23, 42, .82);
            border: 1px solid rgba(226,232,240,.16);
            box-shadow: 0 30px 90px rgba(0,0,0,.44);
        }
        .badge {
            display: inline-flex;
            color: #fde68a;
            background: rgba(245,158,11,.1);
            border: 1px solid rgba(245,199,107,.24);
            padding: 8px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        h1 { font-size: clamp(34px, 6vw, 54px); line-height: 1; letter-spacing: -1.7px; margin-bottom: 14px; }
        p { color: #cbd5e1; line-height: 1.7; margin-bottom: 18px; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 14px;
            color: #111827;
            background: linear-gradient(135deg, #f5c76b, #f59e0b);
            font-weight: 900;
            text-decoration: none;
        }
        code { color: #fde68a; }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">FastAPI Web App</span>
        <h1>Titanic Survival Intelligence</h1>
        <p>
            The upgraded interface now runs through FastAPI so it can save predictions to SQLite and display prediction history.
        </p>
        <p>
            Run <code>uvicorn app.main:app --reload</code>, then open the app from the button below.
        </p>
        <a href="http://127.0.0.1:8000">Open Local App</a>
    </main>
</body>
</html>
